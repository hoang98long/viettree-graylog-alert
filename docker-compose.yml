services:
  backend:
    build:
      context: ./backend
    container_name: asa-monitor-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
    container_name: asa-monitor-frontend
    depends_on:
      - backend
    ports:
      - "5173:80"
    restart: unless-stopped
